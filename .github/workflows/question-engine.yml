name: Question Engine

on:
  push:
    branches: ["feature/question-engine-openai-integration"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r question_engine/requirements.txt
      - run: PYTHONPATH=. pytest -q tests
